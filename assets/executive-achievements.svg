<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195">
  <defs>
    <clipPath id="console_clip">
      <rect width="495" height="195" rx="12"/>
    </clipPath>
    <linearGradient id="console_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F"/>
      <stop offset="100%" stop-color="#0F121A"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#console_clip)">
    <!-- Base Card Container: Linear/Enterprise Minimalist Console -->
    <rect x="0.5" y="0.5" width="494" height="194" rx="12" fill="url(#console_bg)" stroke="#222736" stroke-width="1"/>

    <!-- Header Control Bar -->
    <g transform="translate(18, 20)">
      <!-- System Identity Badge -->
      <circle cx="3" cy="2" r="2" fill="#D1002D"/>
      <text x="10" y="5" font-family="ui-monospace, 'JetBrains Mono', 'SF Mono', Menlo, monospace" font-size="8.5" font-weight="600" letter-spacing="1.1" fill="#94A3B8">HRL SYSTEMS ARCHITECTURE</text>
      <text x="10" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" letter-spacing="-0.2" fill="#FFFFFF">Production Architecture &amp; Delivery Console</text>
      
      <!-- Live CD Status Chip -->
      <rect x="340" y="0" width="120" height="18" rx="9" fill="#091B12" stroke="#10B981" stroke-width="1"/>
      <circle cx="350" cy="9" r="3" fill="#10B981"/>
      <text x="358" y="12.5" font-family="ui-monospace, 'JetBrains Mono', monospace" font-size="8" font-weight="600" letter-spacing="0.4" fill="#34D399">Live CD / Merge Train</text>
    </g>

    <!-- Console Header Divider -->
    <line x1="18" y1="46" x2="477" y2="46" stroke="#1E2330" stroke-width="1"/>

    <!-- Subsystem 1: Cloud & Orchestration -->
    <g transform="translate(18, 64)">
      <rect x="0" y="-8" width="2" height="24" fill="#10B981"/>
      <text x="10" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">Cloud &amp; Orchestration:</text>
      <text x="135" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">GitLab Core &amp; AI Gateway</text>
      <rect x="375" y="-9" width="56" height="13" rx="3" fill="#1E293B"/>
      <text x="380" y="0.5" font-family="ui-monospace, monospace" font-size="8" font-weight="600" fill="#FBBF24">MR !7641</text>
      <rect x="435" y="-9" width="42" height="13" rx="3" fill="#064E3B"/>
      <text x="440" y="0.5" font-family="ui-monospace, monospace" font-size="7.5" font-weight="600" fill="#34D399">Passed</text>
      <text x="10" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8.5" font-weight="400" fill="#94A3B8">Deterministic tool-call validation in ai-assist eliminating runaway loops</text>
    </g>

    <!-- Subsystem 2: Accelerated Compute & GPU -->
    <g transform="translate(18, 98)">
      <rect x="0" y="-8" width="2" height="24" fill="#F59E0B"/>
      <text x="10" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">Accelerated Compute:</text>
      <text x="130" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">GPU &amp; Bare-Metal Systems</text>
      <rect x="375" y="-9" width="56" height="13" rx="3" fill="#1E293B"/>
      <text x="380" y="0.5" font-family="ui-monospace, monospace" font-size="8" font-weight="600" fill="#FBBF24">OFX v2.4</text>
      <rect x="435" y="-9" width="42" height="13" rx="3" fill="#064E3B"/>
      <text x="442" y="0.5" font-family="ui-monospace, monospace" font-size="7.5" font-weight="600" fill="#34D399">Green</text>
      <text x="10" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8.5" font-weight="400" fill="#94A3B8">C++20, CUDA 12.6, Metal, ACEScc color science, DaVinci Resolve GPU runtime</text>
    </g>

    <!-- Subsystem 3: Embedded / Hardware & ASIC -->
    <g transform="translate(18, 132)">
      <rect x="0" y="-8" width="2" height="24" fill="#3B82F6"/>
      <text x="10" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">Embedded &amp; ASIC:</text>
      <text x="115" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">Production Hardware &amp; IC</text>
      <rect x="375" y="-9" width="56" height="13" rx="3" fill="#1E293B"/>
      <text x="382" y="0.5" font-family="ui-monospace, monospace" font-size="8" font-weight="600" fill="#FBBF24">Rev C1</text>
      <rect x="435" y="-9" width="42" height="13" rx="3" fill="#064E3B"/>
      <text x="439" y="0.5" font-family="ui-monospace, monospace" font-size="7.5" font-weight="600" fill="#34D399">0 DRC</text>
      <text x="10" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="8.5" font-weight="400" fill="#94A3B8">TinyFC20 Betaflight quadcopter flight controller PCB &amp; 8-bit CMOS 130nm ALU</text>
    </g>

    <!-- Lower Deck: Synchronized Telemetry & Delivery Tray -->
    <g transform="translate(0, 163)">
      <rect x="0" y="0" width="495" height="32" fill="#07080C"/>
      <line x1="0" y1="0" x2="495" y2="0" stroke="#1E2330" stroke-width="1"/>
      
      <!-- Panel A: Continuous Delivery -->
      <g transform="translate(18, 19)">
        <circle cx="2" cy="-4" r="2.5" fill="#10B981"/>
        <text x="8" y="0" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#94A3B8">CD: <tspan fill="#34D399">PASSING</tspan> · <tspan fill="#CBD5E1">PROD TARGET</tspan></text>
      </g>

      <!-- Panel Divider -->
      <line x1="185" y1="5" x2="185" y2="27" stroke="#1E2330" stroke-width="1"/>

      <!-- Panel B: Contribution Telemetry -->
      <g transform="translate(195, 19)">
        <circle cx="2" cy="-4" r="2.5" fill="#F59E0B"/>
        <text x="8" y="0" font-family="ui-monospace, monospace" font-size="8.5" font-weight="600" fill="#94A3B8">
          <tspan fill="#FBBF24" font-weight="700">1,853 CONTRIBUTIONS</tspan> · <tspan fill="#FBBF24">90D STREAK</tspan> · <tspan fill="#60A5FA">GITLAB TIER 3</tspan>
        </text>
      </g>
    </g>
  </g>
</svg>
