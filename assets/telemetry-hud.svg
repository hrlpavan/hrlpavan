<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="50%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>

    <!-- Crimson Glow Filter -->
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Radar Sweep Gradient -->
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3360" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#d1002d" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#d1002d" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3360" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ff4d7a" stop-opacity="1" />
      <stop offset="100%" stop-color="#ff3360" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="hudGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 51, 96, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes blipPulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.4); }
    }
    @keyframes scanline {
      0% { transform: translateY(0px); opacity: 0.8; }
      50% { opacity: 0.3; }
      100% { transform: translateY(240px); opacity: 0.8; }
    }
    @keyframes ecgScroll {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes barDance1 { 0%, 100% { height: 12px; y: 48px; } 50% { height: 38px; y: 22px; } }
    @keyframes barDance2 { 0%, 100% { height: 35px; y: 25px; } 50% { height: 15px; y: 45px; } }
    @keyframes barDance3 { 0%, 100% { height: 22px; y: 38px; } 50% { height: 42px; y: 18px; } }
    @keyframes barDance4 { 0%, 100% { height: 40px; y: 20px; } 50% { height: 20px; y: 40px; } }
    @keyframes barDance5 { 0%, 100% { height: 18px; y: 42px; } 50% { height: 36px; y: 24px; } }
    @keyframes textBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .radar-sweep-arm {
      transform-origin: 105px 120px;
      animation: radarSpin 4s linear infinite;
    }
    .blip-1 { transform-origin: 120px 95px; animation: blipPulse 2s ease-in-out infinite; }
    .blip-2 { transform-origin: 80px 145px; animation: blipPulse 2.5s ease-in-out infinite 0.6s; }
    .blip-3 { transform-origin: 140px 140px; animation: blipPulse 1.8s ease-in-out infinite 1.1s; }
    .blip-4 { transform-origin: 75px 85px; animation: blipPulse 3s ease-in-out infinite 0.3s; }
    
    .scan-beam {
      animation: scanline 3.5s linear infinite;
    }
    .ecg-line {
      stroke-dasharray: 600;
      animation: ecgScroll 3s linear infinite;
    }
    .bar-1 { animation: barDance1 1.2s ease-in-out infinite; }
    .bar-2 { animation: barDance2 0.9s ease-in-out infinite; }
    .bar-3 { animation: barDance3 1.4s ease-in-out infinite; }
    .bar-4 { animation: barDance4 1.1s ease-in-out infinite; }
    .bar-5 { animation: barDance5 1.3s ease-in-out infinite; }
    .blink-status { animation: textBlink 1.5s ease-in-out infinite; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="846" height="236" rx="10" fill="url(#bgGrad)" stroke="rgba(209, 0, 45, 0.4)" stroke-width="1.5" />
  <rect x="2" y="2" width="846" height="236" rx="10" fill="url(#hudGrid)" />

  <!-- Corner Brackets (Cyberpunk Tactical Frame) -->
  <path d="M 6 22 L 6 6 L 22 6" fill="none" stroke="#ff3360" stroke-width="2.5" />
  <path d="M 828 6 L 844 6 L 844 22" fill="none" stroke="#ff3360" stroke-width="2.5" />
  <path d="M 6 218 L 6 234 L 22 234" fill="none" stroke="#ff3360" stroke-width="2.5" />
  <path d="M 844 218 L 844 234 L 828 234" fill="none" stroke="#ff3360" stroke-width="2.5" />

  <!-- Horizontal Scanning Laser Beam -->
  <line class="scan-beam" x1="4" y1="0" x2="846" y2="0" stroke="rgba(255, 77, 122, 0.25)" stroke-width="1.5" />

  <!-- ==================== LEFT: RADAR / TELEMETRY SWEEP ==================== -->
  <g id="radar-system">
    <!-- Radar concentric rings -->
    <circle cx="105" cy="120" r="75" fill="none" stroke="rgba(209, 0, 45, 0.2)" stroke-width="1" />
    <circle cx="105" cy="120" r="55" fill="none" stroke="rgba(209, 0, 45, 0.3)" stroke-width="1" />
    <circle cx="105" cy="120" r="35" fill="none" stroke="rgba(209, 0, 45, 0.4)" stroke-width="1" />
    <circle cx="105" cy="120" r="15" fill="none" stroke="rgba(255, 51, 96, 0.6)" stroke-width="1.5" />
    <!-- Radar crosshairs -->
    <line x1="30" y1="120" x2="180" y2="120" stroke="rgba(209, 0, 45, 0.25)" stroke-width="1" stroke-dasharray="2 3" />
    <line x1="105" y1="45" x2="105" y2="195" stroke="rgba(209, 0, 45, 0.25)" stroke-width="1" stroke-dasharray="2 3" />

    <!-- Rotating Radar Sweep Wedge -->
    <g class="radar-sweep-arm">
      <path d="M 105 120 L 180 120 A 75 75 0 0 0 158 67 Z" fill="url(#radarSweep)" />
      <line x1="105" y1="120" x2="180" y2="120" stroke="#ff4d7a" stroke-width="1.5" filter="url(#crimsonGlow)" />
    </g>

    <!-- Radar Blips (Active Projects Nodes) -->
    <circle class="blip-1" cx="120" cy="95" r="3.5" fill="#ff4d7a" filter="url(#intenseGlow)" />
    <circle class="blip-2" cx="80" cy="145" r="3" fill="#ff3360" filter="url(#intenseGlow)" />
    <circle class="blip-3" cx="140" cy="140" r="3.5" fill="#00ffcc" filter="url(#intenseGlow)" />
    <circle class="blip-4" cx="75" cy="85" r="2.5" fill="#ff4d7a" filter="url(#crimsonGlow)" />

    <!-- Center Pivot -->
    <circle cx="105" cy="120" r="3" fill="#ffffff" filter="url(#intenseGlow)" />

    <!-- Radar Label -->
    <text x="105" y="210" fill="#a0a5b5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="600" text-anchor="middle" letter-spacing="1.5">
      SPATIAL RADAR // 54 NODES
    </text>
  </g>

  <!-- Divider Line 1 -->
  <line x1="205" y1="25" x2="205" y2="215" stroke="rgba(255, 51, 96, 0.2)" stroke-width="1" stroke-dasharray="4 4" />

  <!-- ==================== CENTER: SYSTEM HUD & METRICS ==================== -->
  <g id="center-telemetry" transform="translate(225, 0)">
    <!-- Header Badge -->
    <rect x="0" y="20" width="135" height="18" rx="4" fill="rgba(209, 0, 45, 0.2)" stroke="rgba(255, 51, 96, 0.5)" stroke-width="1" />
    <circle class="blink-status" cx="10" cy="29" r="3.5" fill="#00ff88" filter="url(#intenseGlow)" />
    <text x="20" y="32" fill="#ff4d7a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9.5" font-weight="700" letter-spacing="1">
      LIVE TELEMETRY
    </text>

    <text x="145" y="32" fill="#7d8590" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9.5" font-weight="500">
      FEED: <tspan fill="#ffffff" font-weight="700">AUTONOMOUS SYNC</tspan> // PROTOCOL v2.4
    </text>

    <!-- Main Title -->
    <text x="0" y="62" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" letter-spacing="0.5">
      HRL HIGH-VELOCITY ENGINEERING ENGINE
    </text>

    <!-- Metrics Grid (Accurately Placed & Spaced) -->
    <g transform="translate(0, 80)">
      <!-- Metric Card 1 -->
      <rect x="0" y="0" width="124" height="48" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 51, 96, 0.2)" stroke-width="1" />
      <text x="10" y="16" fill="#8b949e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8" font-weight="600" letter-spacing="0.6">ECOSYSTEM</text>
      <text x="10" y="37" fill="#ff4d7a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="14.5" font-weight="800">54+ REPOS</text>

      <!-- Metric Card 2 -->
      <rect x="133" y="0" width="124" height="48" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 51, 96, 0.2)" stroke-width="1" />
      <text x="143" y="16" fill="#8b949e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8" font-weight="600" letter-spacing="0.6">DAILY STREAK</text>
      <text x="143" y="37" fill="#00ffcc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="14.5" font-weight="800">100% ACTIVE</text>

      <!-- Metric Card 3 -->
      <rect x="266" y="0" width="124" height="48" rx="6" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 51, 96, 0.2)" stroke-width="1" />
      <text x="276" y="16" fill="#8b949e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8" font-weight="600" letter-spacing="0.6">CORE VELOCITY</text>
      <text x="276" y="37" fill="#ffb3c6" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13.5" font-weight="800">100X SCALE</text>
    </g>

    <!-- Oscilloscope ECG Waveform Section (Zero Word Overlap) -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="390" height="65" rx="6" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 51, 96, 0.15)" stroke-width="1" />
      <!-- Wave grid lines -->
      <line x1="0" y1="30" x2="390" y2="30" stroke="rgba(255, 51, 96, 0.1)" stroke-width="1" stroke-dasharray="4 4" />
      <line x1="130" y1="0" x2="130" y2="65" stroke="rgba(255, 51, 96, 0.1)" stroke-width="1" stroke-dasharray="4 4" />
      <line x1="260" y1="0" x2="260" y2="65" stroke="rgba(255, 51, 96, 0.1)" stroke-width="1" stroke-dasharray="4 4" />

      <!-- High Tech Dynamic Wave Path -->
      <path class="ecg-line" d="M 0 30 L 35 30 L 45 15 L 55 48 L 65 20 L 75 36 L 85 30 L 140 30 L 150 10 L 160 52 L 170 18 L 180 38 L 190 30 L 250 30 L 260 12 L 270 50 L 280 16 L 290 34 L 300 30 L 350 30 L 360 8 L 370 55 L 380 20 L 390 30"
            fill="none" stroke="url(#waveGrad)" stroke-width="2" filter="url(#crimsonGlow)" />

      <!-- Left Telemetry Info -->
      <text x="10" y="54" fill="#8b949e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8.5" font-weight="600" letter-spacing="0.5">
        BUS: PCIe Gen5 x16 // 4.8 GHz
      </text>
      <!-- Right Telemetry Info (Anchored on Right with 140px safe buffer) -->
      <text x="380" y="54" fill="#ff4d7a" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8.5" font-weight="700" text-anchor="end" letter-spacing="0.5">
        LATENCY: &lt; 0.17 µs
      </text>
    </g>
  </g>

  <!-- Divider Line 2 -->
  <line x1="640" y1="25" x2="640" y2="215" stroke="rgba(255, 51, 96, 0.2)" stroke-width="1" stroke-dasharray="4 4" />

  <!-- ==================== RIGHT: REAL-TIME EQUALIZER & SYSTEM READOUT ==================== -->
  <g id="right-equalizer" transform="translate(660, 0)">
    <!-- Header -->
    <text x="0" y="32" fill="#8b949e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="9" font-weight="700" letter-spacing="1.2">
      PIPELINE TELEMETRY
    </text>

    <!-- Animated Equalizer Bars -->
    <g transform="translate(0, 45)">
      <rect class="bar-1" x="0" y="22" width="14" height="38" rx="2" fill="#d1002d" filter="url(#crimsonGlow)" />
      <rect class="bar-2" x="18" y="25" width="14" height="35" rx="2" fill="#ff3360" filter="url(#crimsonGlow)" />
      <rect class="bar-3" x="36" y="18" width="14" height="42" rx="2" fill="#ff4d7a" filter="url(#crimsonGlow)" />
      <rect class="bar-4" x="54" y="20" width="14" height="40" rx="2" fill="#ff3360" filter="url(#crimsonGlow)" />
      <rect class="bar-5" x="72" y="24" width="14" height="36" rx="2" fill="#d1002d" filter="url(#crimsonGlow)" />
      <rect class="bar-2" x="90" y="28" width="14" height="32" rx="2" fill="#ff4d7a" filter="url(#crimsonGlow)" />
      <rect class="bar-4" x="108" y="22" width="14" height="38" rx="2" fill="#ff3360" filter="url(#crimsonGlow)" />
      <rect class="bar-1" x="126" y="26" width="14" height="34" rx="2" fill="#d1002d" filter="url(#crimsonGlow)" />
      <rect class="bar-3" x="144" y="19" width="14" height="41" rx="2" fill="#ff4d7a" filter="url(#crimsonGlow)" />
      <rect class="bar-5" x="162" y="25" width="14" height="35" rx="2" fill="#ff3360" filter="url(#crimsonGlow)" />
    </g>

    <!-- Status Readout Box -->
    <rect x="0" y="112" width="176" height="96" rx="6" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 51, 96, 0.2)" stroke-width="1" />
    
    <text x="12" y="130" fill="#8b949e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8.5" font-weight="600">
      STPI / MeitY: <tspan fill="#00ff88" font-weight="700">COMPLIANT</tspan>
    </text>
    <text x="12" y="146" fill="#8b949e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8.5" font-weight="600">
      GWR V12 CLAIM: <tspan fill="#00ffcc" font-weight="700">SUBMITTED</tspan>
    </text>
    <text x="12" y="162" fill="#8b949e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8.5" font-weight="600">
      GEOSPATIAL MCP: <tspan fill="#ff4d7a" font-weight="700">ONLINE</tspan>
    </text>
    <text x="12" y="178" fill="#8b949e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8.5" font-weight="600">
      VM PROTOCOL: <tspan fill="#ffffff" font-weight="700">ORCHESTRATED</tspan>
    </text>
    <text x="12" y="195" fill="#ff3360" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="8.5" font-weight="800" letter-spacing="1">
      STATUS: NOMINAL // 100%
    </text>
  </g>
</svg>
