name: Daily Contribution Telemetry & Snake Sync

on:
  schedule:
    # Run automatically every 4 hours to keep daily streak and snake animation live
    - cron: "0 */4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Synchronize Live Daily Contribution Streak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/update_daily_streak.py

      - name: Generate GitHub Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: hrlpavan
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#FFE066&color_dots=#121216,#3D3012,#7E6219,#D4AF37,#FFD700
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFE066&color_dots=#121216,#3D3012,#7E6219,#D4AF37,#FFD700

      - name: Inject Metallic Glow Filter on Contribution Snake
        run: |
          python3 -c "
          from pathlib import Path
          for f in ['assets/github-contribution-grid-snake-dark.svg', 'assets/github-contribution-grid-snake.svg']:
              p = Path(f)
              if p.exists():
                  c = p.read_text(encoding='utf-8')
                  if 'filter:drop-shadow' not in c:
                      c = c.replace('.s{shape-rendering:geometricPrecision;fill:var(--cs);', '.s{shape-rendering:geometricPrecision;fill:var(--cs);filter:drop-shadow(0 0 3px rgba(255,215,0,0.85)) drop-shadow(0 0 7px rgba(212,175,55,0.55));')
                      p.write_text(c, encoding='utf-8')
          "

      - name: Commit & Push Telemetry Assets
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore(telemetry): auto-sync daily contribution streak & snake [skip ci]"
          add: "assets/ README.md"
          pull: "--rebase --autostash"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
